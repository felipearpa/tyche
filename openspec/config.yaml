schema: spec-driven

context: |
  Backend: F# on AWS Lambda, DynamoDB (single-table design per bounded context:
  Account, Pool, PoolLayout, MatchScoreIngestion), SQS FIFO, S3.
  Mobile: iOS (Swift/SwiftUI), Android (Kotlin/Compose).
  Consumer-facing app name is "Fortuna" (repo is "Tyche") — use Fortuna in user-facing copy.
  Idiomatic F#: no mutable collections, no NoOp/stub DI implementations,
  repositories are data access only (no messaging or orchestration).
  Read docs/database-model.md before any task that touches persistence.

rules:
  specs:
    - Use Given/When/Then format for scenarios
    - >-
      For future mobile UI specifications that introduce or change app-rendered icons,
      prefer Material Symbols when a semantically accurate representation exists;
      otherwise allow a custom icon without requiring or recording a justification.
      Require iOS and Android to use assets derived from the same committed canonical
      vector source. Do not prescribe SF Symbols on iOS or Compose Material Icons.* on
      Android. Exclude controls rendered entirely by the operating system, and do not
      retroactively revise existing specifications solely to apply this rule.
    - >-
      For future mobile UI specifications that introduce or change model-backed loading
      placeholders, require each affected platform to populate the production item or row
      component with a placeholder model and apply the existing shared platform shimmer
      treatment. Do not prescribe a separately maintained skeleton-only layout.
      Placeholder-specific behavior may suppress remote loading, navigation, and
      accessibility exposure, but must not replace the production layout. Do not expose
      placeholder values as real user content, and do not retroactively revise existing
      specifications solely to apply this rule.
  tasks:
    - "Group tasks by platform: backend, iOS, Android"
