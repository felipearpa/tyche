  IssueAvatarUploadUrl:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Function.AccountFunction::IssueAvatarUploadUrlAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          AVATAR_BUCKET_NAME: !Sub "tyche-avatars-${AWS::AccountId}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Account"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Account/index/GetByEmail-index"
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::tyche-avatars-${AWS::AccountId}/avatars/*"
      Architectures: [ arm64 ]
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            Path: /accounts/{accountId}/avatar-upload-url
            Method: POST
            ApiId: !Ref AuthGatewayHttpApi

  AvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tyche-avatars-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  AvatarsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AvatarsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource:
              - !Sub "arn:aws:s3:::tyche-avatars-${AWS::AccountId}/avatars/*"

  # Complete stream batches that exhaust their retries are written here with their records,
  # so they can be replayed after the stream's 24-hour retention (operations/README.md).
  StreamFailureBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "tyche-stream-failures-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRetainedFailures
            Status: Enabled
            ExpirationInDays: 90

  OnPoolChange:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Event.PoolEvent::OnPoolChangeAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          POOL_COMMAND_QUEUE_URL: !Ref UpdatePositionsQueue
          POOL_MAINTENANCE_QUEUE_URL: !Ref PoolMaintenanceQueue
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListStreams
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !Ref PoolStreamArn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/PoolLayout"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt UpdatePositionsQueue.Arn
                - !GetAtt PoolMaintenanceQueue.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !GetAtt StreamFailureBucket.Arn
                - !Sub "${StreamFailureBucket.Arn}/*"
      Architectures: [ arm64 ]
      Events:
        PoolStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref PoolStreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 21600
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamFailureBucket.Arn
            Enabled: true

  OnMembershipChange:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Event.MembershipEvent::OnMembershipChangeAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          POOL_COMMAND_QUEUE_URL: !Ref UpdatePositionsQueue
          POOL_MAINTENANCE_QUEUE_URL: !Ref PoolMaintenanceQueue
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListStreams
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !Ref PoolStreamArn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt UpdatePositionsQueue.Arn
                - !GetAtt PoolMaintenanceQueue.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !GetAtt StreamFailureBucket.Arn
                - !Sub "${StreamFailureBucket.Arn}/*"
      Architectures: [ arm64 ]
      Events:
        MembershipStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref PoolStreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 21600
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamFailureBucket.Arn
            # Only membership records: details, receipts, and the pool root never reach the
            # handler, so projection and position writes on details cannot trigger it.
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"pk":{"S":[{"prefix":"POOL#"}]},"sk":{"S":[{"prefix":"GAMBLER#"}]}}}}'
            Enabled: true

  UpdatePositionsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: UpdatePositionsQueue-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  # Ordered per-pool command queue (the name predates the settlement commands it now carries).
  # Visibility outlasts six worker timeouts; deadline yields make the message visible at once.
  UpdatePositionsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: UpdatePositionsQueue.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt UpdatePositionsDeadLetterQueue.Arn
        maxReceiveCount: 30

  PoolMaintenanceDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: PoolMaintenanceQueue-dlq
      MessageRetentionPeriod: 1209600

  PoolMaintenanceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: PoolMaintenanceQueue
      VisibilityTimeout: 720
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PoolMaintenanceDeadLetterQueue.Arn
        maxReceiveCount: 5

  OnPoolLayoutChange:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Event.PoolLayoutEvent::OnPoolLayoutChangeAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1769
      Timeout: 120
      Environment:
        Variables:
          POOL_COMMAND_QUEUE_URL: !Ref UpdatePositionsQueue
          POOL_MAINTENANCE_QUEUE_URL: !Ref PoolMaintenanceQueue
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListStreams
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !Ref PoolLayoutStreamArn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/PoolLayout"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool/index/GetPoolGamblerScoresByMatch-index"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool/index/GetGamblersByPoolLayout-index"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt UpdatePositionsQueue.Arn
                - !GetAtt PoolMaintenanceQueue.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !GetAtt StreamFailureBucket.Arn
                - !Sub "${StreamFailureBucket.Arn}/*"
      Architectures: [ arm64 ]
      Events:
        PoolStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref PoolLayoutStreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 21600
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamFailureBucket.Arn
            Enabled: !If [ SettlementProcessingIsEnabled, true, false ]

  OnUpdatePositions:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Event.PoolOperationEvent::OnPoolCommandAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 300
      # Deferred commands are republished to this function's own queue; recursion is intended and bounded.
      RecursiveLoop: Allow
      Environment:
        Variables:
          POOL_COMMAND_QUEUE_URL: !Ref UpdatePositionsQueue
          POOL_MAINTENANCE_QUEUE_URL: !Ref PoolMaintenanceQueue
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
                - sqs:SendMessage
              Resource: !GetAtt UpdatePositionsQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/PoolLayout"
      Architectures: [ arm64 ]
      Events:
        SqsEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt UpdatePositionsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            Enabled: !If [ SettlementProcessingIsEnabled, true, false ]

  OnPoolMaintenanceJob:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Event.PoolMaintenanceEvent::OnPoolMaintenanceJobAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 120
      # Jobs enqueue their continuations on this function's own queue; recursion is intended and bounded.
      RecursiveLoop: Allow
      Environment:
        Variables:
          POOL_COMMAND_QUEUE_URL: !Ref UpdatePositionsQueue
          POOL_MAINTENANCE_QUEUE_URL: !Ref PoolMaintenanceQueue
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:SendMessage
              Resource: !GetAtt PoolMaintenanceQueue.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt UpdatePositionsQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool/index/GetPoolGamblerScoresByMatch-index"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/PoolLayout"
      Architectures: [ arm64 ]
      Events:
        SqsEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt PoolMaintenanceQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # The rate limit for backfill and propagation writes.
            ScalingConfig:
              MaximumConcurrency: !Ref PoolMaintenanceMaximumConcurrency
            Enabled: true

  OperationsAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tyche-pool-operations-alarms

  PoolCommandDeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A pool command reached the dead-letter queue; its pool keeps its active fence (operations/README.md).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt UpdatePositionsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  PoolMaintenanceDeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A maintenance job (propagation, backfill, reconciliation) exhausted its retries.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PoolMaintenanceDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  PoolCommandBacklogAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The oldest pool command has waited more than 15 minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt UpdatePositionsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  ProjectionBacklogAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Total propagation or maintenance work has waited more than 15 minutes (projection lag).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PoolMaintenanceQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  PoolBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A pool operation is blocked after repeated attempts without progress.
      Namespace: Tyche/PoolOperations
      MetricName: OperationBlocked
      Dimensions:
        - Name: Handler
          Value: PoolOperationEvent
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  ActiveOperationAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A pool operation has been active for more than 30 minutes.
      Namespace: Tyche/PoolOperations
      MetricName: ActiveOperationAge
      Dimensions:
        - Name: Handler
          Value: PoolOperationEvent
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1800
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  StreamRecordFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Pool stream records keep failing; exhausted batches go to the stream failure bucket.
      Namespace: Tyche/PoolOperations
      MetricName: StreamRecordFailures
      Dimensions:
        - Name: Handler
          Value: PoolLayoutEvent
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  PoolLayoutStreamIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Result dispatch is more than 10 minutes behind the PoolLayout stream.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref OnPoolLayoutChange
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  PoolStreamIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Membership handling is more than 10 minutes behind the Pool stream.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref OnMembershipChange
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref OperationsAlarmTopic ]

  MatchScoreSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeIngestMatchScore
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt IngestMatchScore.Arn

  IngestMatchScore:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Event.MatchScoreEvent::IngestMatchScoreAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          FOOTBALL_DATA_TOKEN_PARAMETER: /tyche/football-data/token
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/MatchScoreIngestion"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/PoolLayout"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:us-east-2:${AWS::AccountId}:parameter/tyche/football-data/token"
      Architectures: [ arm64 ]

  OnMatchScoreIngestionChange:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Event.MatchScoreIngestionEvent::OnMatchScoreIngestionChangeAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          INGEST_MATCH_SCORE_FUNCTION_ARN: !GetAtt IngestMatchScore.Arn
          MATCH_SCORE_SCHEDULER_ROLE_ARN: !GetAtt MatchScoreSchedulerRole.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListStreams
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !Ref MatchScoreIngestionStreamArn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !GetAtt StreamFailureBucket.Arn
                - !Sub "${StreamFailureBucket.Arn}/*"
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource:
                - !Sub "arn:aws:scheduler:us-east-2:${AWS::AccountId}:schedule/default/match-score-*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt MatchScoreSchedulerRole.Arn
      Architectures: [ arm64 ]
      Events:
        MatchScoreIngestionStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref MatchScoreIngestionStreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 21600
            BisectBatchOnFunctionError: true
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamFailureBucket.Arn
            Enabled: true

Outputs:
  PoolCommandQueueUrl:
    Value: !Ref UpdatePositionsQueue
  PoolMaintenanceQueueUrl:
    Value: !Ref PoolMaintenanceQueue
  PoolCommandDeadLetterQueueUrl:
    Value: !Ref UpdatePositionsDeadLetterQueue
  StreamFailureBucketName:
    Value: !Ref StreamFailureBucket
  ApiURL:
    Description: API endpoint URL for Prod environment
    Value:
      Fn::Sub: https://${AuthGatewayHttpApi}.execute-api.${AWS::Region}.amazonaws.com/
