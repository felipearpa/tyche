AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Tyche API v1.3.0
Parameters:
  PoolStreamArn:
    Type: String
    Description: Stream of the externally managed Pool table (see operations/pool-table.sh).
  PoolLayoutStreamArn:
    Type: String
  MatchScoreIngestionStreamArn:
    Type: String
  SettlementProcessingEnabled:
    Type: String
    AllowedValues: [ "true", "false" ]
    Default: "true"
    Description: >-
      Enables the layout stream mapping and the pool command consumer. Set to false to quiesce
      settlement during a cutover; stream records and queued commands are retained meanwhile.
  PoolMaintenanceMaximumConcurrency:
    Type: Number
    MinValue: 2
    MaxValue: 1000
    Default: 16
    Description: >-
      Maximum concurrent OnPoolMaintenanceJob invocations, which bounds backfill and propagation
      write rate. 16 propagates a 5,000-member pool in about 210 s within the 1,000 account quota.
Conditions:
  SettlementProcessingIsEnabled: !Equals [ !Ref SettlementProcessingEnabled, "true" ]
Resources:
  AuthGatewayHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          FirebaseAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: https://securetoken.google.com/tyche-588ce
              audience:
                - tyche-588ce
        DefaultAuthorizer: FirebaseAuthorizer

  GetVersion:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Function.VersionFunction::GetVersionAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
      Architectures: [ arm64 ]
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            Path: /version
            Method: GET
            ApiId: !Ref AuthGatewayHttpApi
            Auth:
              Authorizer: NONE

  GetPoolById:
    Type: AWS::Serverless::Function
    Properties:
      Handler: Felipearpa.Tyche.AmazonLambda::Felipearpa.Tyche.AmazonLambda.Function.PoolFunction::GetPoolByIdAsync
      Runtime: dotnet10
      CodeUri: .
      MemorySize: 1024
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool"
      Architectures: [ arm64 ]
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            Path: /pools/{poolId}
            Method: GET
            ApiId: !Ref AuthGatewayHttpApi
  
