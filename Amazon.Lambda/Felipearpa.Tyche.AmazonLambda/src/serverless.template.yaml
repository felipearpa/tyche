                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/Pool/index/GetPoolGamblerScoresByPool-index"
                - !Sub "arn:aws:dynamodb:us-east-2:${AWS::AccountId}:table/PoolLayout"
      Architectures: [ arm64 ]
      Events:
        HttpApi:
